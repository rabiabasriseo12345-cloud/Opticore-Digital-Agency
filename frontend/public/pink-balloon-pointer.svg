<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Hollow Outline Pink Balloon Pointer - No fill, transparent inside, shocking pink + sparkle -->
  <defs>
    <filter id="hollowPointerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#ff007f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Interactive Sparkle Star at the click point (top-left) -->
  <path d="M 4 1 L 5 3.5 L 7.5 4.5 L 5 5.5 L 4 8 L 3 5.5 L 0.5 4.5 L 3 3.5 Z" 
        stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 4 1 L 5 3.5 L 7.5 4.5 L 5 5.5 L 4 8 L 3 5.5 L 0.5 4.5 L 3 3.5 Z" 
        fill="#ff007f" stroke="#ff1493" stroke-width="0.8" stroke-linejoin="round"/>
  <circle cx="9" cy="2" r="1" fill="#ffffff"/>
  <circle cx="9" cy="2" r="0.6" fill="#ff1493"/>

  <g filter="url(#hollowPointerGlow)" transform="rotate(-15 16 16)">
    <!-- White backing outline -->
    <path d="M 15 3 C 8.5 3 4 8 4 14 C 4 19.5 8.8 23.2 13.5 24.2 L 12.5 26 L 15 25.2 L 17.5 26 L 16.5 24.2 C 21.2 23.2 26 19.5 26 14 C 26 8 21.5 3 15 3 Z" 
          stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 15 26.2 Q 11.5 29 15.5 31 Q 19.5 33 15 35" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Main Shocking Pink Sketch Outline (Hollow, fill="none") -->
    <path d="M 15 3 C 8.5 3 4 8 4 14 C 4 19.5 8.8 23.2 13.5 24.2 L 12.5 26 L 15 25.2 L 17.5 26 L 16.5 24.2 C 21.2 23.2 26 19.5 26 14 C 26 8 21.5 3 15 3 Z" 
          stroke="#ff007f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Secondary Baby Pink Sketch Pen Accent -->
    <path d="M 14 4 C 8.8 4.5 5 8.8 5 14.2 C 5 18.8 9 22.5 13.5 23.6" 
          stroke="#ff69b4" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 1.5" fill="none"/>

    <!-- White Highlight Arc -->
    <path d="M 7.5 8.5 C 6.5 11 6.5 14 7.8 16" 
          stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="9" cy="6.8" r="1" fill="#ffffff"/>

    <!-- Knot -->
    <path d="M 12.8 24.8 Q 15 26.2 17.2 24.8" 
          stroke="#ff007f" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Wavy Loose String -->
    <path d="M 15 26.2 Q 11.5 29 15.5 31 Q 19.5 33 15 35" 
          stroke="#ff007f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
