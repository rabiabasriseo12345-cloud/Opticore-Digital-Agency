<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Hollow Outline Pink Balloon Sketch - No inside fill, transparent center -->
  <defs>
    <filter id="hollowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ff1493" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#hollowGlow)" transform="rotate(-12 15 15)">
    <!-- White backing outline for contrast over dark blue and light backgrounds -->
    <path d="M 15 3 C 8.5 3 4 8 4 14 C 4 19.5 8.8 23.2 13.5 24.2 L 12.5 26 L 15 25.2 L 17.5 26 L 16.5 24.2 C 21.2 23.2 26 19.5 26 14 C 26 8 21.5 3 15 3 Z" 
          stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 15 26.2 Q 12 29 15.5 31 Q 19 33 15 35" 
          stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Main Shocking Pink Sketch Outline (Completely hollow, fill="none") -->
    <path d="M 15 3 C 8.5 3 4 8 4 14 C 4 19.5 8.8 23.2 13.5 24.2 L 12.5 26 L 15 25.2 L 17.5 26 L 16.5 24.2 C 21.2 23.2 26 19.5 26 14 C 26 8 21.5 3 15 3 Z" 
          stroke="#ff1493" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Secondary Baby Pink Sketch Pen Accent (Hand-drawn organic double line) -->
    <path d="M 14 4 C 8.8 4.5 5 8.8 5 14.2 C 5 18.8 9 22.5 13.5 23.6" 
          stroke="#ff69b4" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 1.5" fill="none"/>

    <!-- Subtle White Sketch Highlight (Reflection arc) -->
    <path d="M 7.5 8.5 C 6.5 11 6.5 14 7.8 16" 
          stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="9" cy="6.8" r="0.8" fill="#ffffff"/>

    <!-- Sketched Tied Knot at Bottom (Hollow) -->
    <path d="M 12.8 24.8 Q 15 26.2 17.2 24.8" 
          stroke="#ff1493" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Wavy Loose Trailing String -->
    <path d="M 15 26.2 Q 12 29 15.5 31 Q 19 33 15 35" 
          stroke="#ff1493" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
